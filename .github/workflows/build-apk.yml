name: Build Offline Ruqyah APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Download uploaded files
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          test -f ruqyah-project.zip
          unzip -o -q ruqyah-project.zip -d .
          test -f app/build.gradle

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download 65 Al-Minshawi verse recordings
        run: python3 scripts/download_audio.py

      - name: Build offline APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Check APK includes all 65 recordings
        run: |
          python3 - <<'PYTEST'
          import json, zipfile
          names = json.load(open('scripts/verses.json'))['unique_files']
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              missing = [n for n in names if 'assets/audio/'+n not in apk.namelist()]
          if missing:
              raise SystemExit('Recordings absent from APK: '+str(missing))
          print('Confirmed all',len(names),'recordings in APK.')
          PYTEST

      - name: Attach APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Ruqyah-AlMinshawi-Offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
